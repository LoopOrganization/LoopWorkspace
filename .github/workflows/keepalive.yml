name: Keepalive Workflow

on:
  schedule:
    - cron: "0 0 1 * *" # Runs at midnight on the 1st of every month
  workflow_dispatch: # This allows you to run it manually for testing

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true # This pokes the GitHub API instead of making a visible commit
